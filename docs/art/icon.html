<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'YoungSerif'; src: url('fonts/YoungSerif-Regular.ttf'); }
  @font-face { font-family: 'WorkSans'; src: url('fonts/WorkSans-Regular.ttf'); }
  @font-face { font-family: 'WorkSansB'; src: url('fonts/WorkSans-Bold.ttf'); }
  @font-face { font-family: 'Tektur'; src: url('fonts/Tektur-Regular.ttf'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(120% 90% at 50% 18%, #1d271b 0%, #10150f 45%, #070a07 100%);
    font-family: 'WorkSans', sans-serif;
    color: #eadfc4;
  }

  /* faint tombstones pattern */
  .pattern { position: absolute; inset: 0; opacity: .10; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 42%, transparent 40%, rgba(0,0,0,.72) 100%); }
  .grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; }

  .frame {
    position: absolute; inset: 22px;
    border: 1px solid rgba(217,164,65,.55);
    box-shadow: inset 0 0 0 6px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.6);
  }
  .tick { position: absolute; width: 14px; height: 14px; border: 1px solid rgba(217,164,65,.75); }
  .tick.tl { left: 16px; top: 16px; border-right: 0; border-bottom: 0; }
  .tick.tr { right: 16px; top: 16px; border-left: 0; border-bottom: 0; }
  .tick.bl { left: 16px; bottom: 16px; border-right: 0; border-top: 0; }
  .tick.br { right: 16px; bottom: 16px; border-left: 0; border-top: 0; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }

  .emblem { margin-top: 74px; width: 208px; height: 208px; position: relative; filter: drop-shadow(0 6px 16px rgba(0,0,0,.7)); }

  .title {
    margin-top: 26px;
    font-family: 'YoungSerif', serif;
    font-size: 60px; line-height: 1;
    letter-spacing: 6px; color: #eadfc4;
    text-shadow: 0 2px 0 #000, 0 0 18px rgba(147,178,90,.18);
  }
  .rule { margin-top: 14px; width: 210px; height: 1px; background: linear-gradient(90deg, transparent, rgba(217,164,65,.8), transparent); }
  .sub { margin-top: 12px; font-family: 'Tektur', sans-serif; font-size: 15px; letter-spacing: 7px; color: #93b25a; opacity: .92; }

  .chip {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px 9px 14px;
    border: 1px solid rgba(217,164,65,.45);
    background: linear-gradient(180deg, rgba(35,30,20,.92), rgba(22,18,12,.92));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.5);
  }
  .chip .num { font-family: 'WorkSansB', sans-serif; font-size: 26px; color: #d9a441; letter-spacing: 1px; }
  .chip .slash { color: rgba(234,223,196,.55); font-size: 22px; }
  .chip .max { font-family: 'WorkSans', sans-serif; font-size: 22px; color: #eadfc4; }
</style>
</head>
<body>
  <svg class="pattern" viewBox="0 0 512 512" preserveAspectRatio="none">
    <defs>
      <pattern id="tomb" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
        <g fill="none" stroke="#eadfc4" stroke-width="2">
          <path d="M18 46 V26 a10 10 0 0 1 20 0 V46 Z"/>
          <path d="M24 32 h8 M28 26 v12"/>
        </g>
      </pattern>
    </defs>
    <rect width="512" height="512" fill="url(#tomb)"/>
  </svg>

  <div class="vignette"></div>
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)" opacity="0.5"/></svg>

  <div class="frame"></div>
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>

  <div class="content">
    <svg class="emblem" viewBox="0 0 208 208">
      <defs>
        <radialGradient id="iris" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#2a3422"/>
          <stop offset="70%" stop-color="#141a12"/>
          <stop offset="100%" stop-color="#0a0d08"/>
        </radialGradient>
      </defs>
      <circle cx="104" cy="104" r="99" fill="none" stroke="#d9a441" stroke-width="2.5" opacity=".85"/>
      <circle cx="104" cy="104" r="88" fill="url(#iris)" stroke="#3a472c" stroke-width="1.5"/>
      <!-- skull -->
      <g transform="translate(0,4)">
        <path d="M104 46 c-26 0 -42 18 -42 42 c0 16 7 26 12 31 v10 c0 5 4 8 9 8 h42 c5 0 9 -3 9 -8 v-10 c5 -5 12 -15 12 -31 c0 -24 -16 -42 -42 -42 z"
              fill="#eadfc4"/>
        <ellipse cx="88" cy="86" rx="10" ry="12" fill="#0e120d"/>
        <ellipse cx="120" cy="86" rx="10" ry="12" fill="#0e120d"/>
        <circle cx="88" cy="87" r="3.4" fill="#93b25a"/>
        <circle cx="120" cy="86" r="2.6" fill="#5c6f3c"/>
        <path d="M104 98 l-6 13 h12 z" fill="#0e120d"/>
        <g fill="#0e120d">
          <rect x="88" y="120" width="4" height="12"/><rect x="98" y="120" width="4" height="12"/>
          <rect x="108" y="120" width="4" height="12"/><rect x="118" y="120" width="4" height="12"/>
        </g>
        <!-- collar -->
        <path d="M68 148 a40 40 0 0 0 72 0" fill="none" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
        <circle cx="104" cy="156" r="6" fill="#d9a441" stroke="#0e120d" stroke-width="1.5"/>
        <circle cx="78" cy="141" r="3" fill="#7c2f2a"/>
        <circle cx="130" cy="141" r="3" fill="#7c2f2a"/>
      </g>
    </svg>

    <div class="title">ZOMBIE HQ</div>
    <div class="rule"></div>
    <div class="sub">GRAVEYARD KEEPER II</div>
  </div>

  <div class="chip">
    <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2 c-4 0 -6.5 2.8 -6.5 6.5 c0 2.4 1 3.9 1.8 4.7 v1.6 c0 .8 .6 1.2 1.4 1.2 h6.6 c.8 0 1.4 -.4 1.4 -1.2 v-1.6 c.8 -.8 1.8 -2.3 1.8 -4.7 C16.5 4.8 14 2 10 2 z" fill="#eadfc4"/><circle cx="7.6" cy="8.4" r="1.5" fill="#0e120d"/><circle cx="12.4" cy="8.4" r="1.5" fill="#0e120d"/><path d="M9 12 h2 l-1 1.6 z" fill="#0e120d"/></svg>
    <span class="num">8</span><span class="slash">/</span><span class="max">10</span>
  </div>
</body>
</html>
